```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınırsız Toplu Arkaplan Silici</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .dropzone-active { border-color: #3b82f6 !important; background-color: #eff6ff !important; }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .toast-enter { animation: slideIn 0.3s forwards; }
        .toast-leave { animation: slideOut 0.3s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-blue-500"></i>
                Sınırsız Arkaplan Silici
            </h1>
            <div class="text-sm font-semibold text-green-600 bg-green-50 px-3 py-1 rounded-full flex items-center border border-green-200">
                <i class="fa-solid fa-infinity mr-1"></i> %100 Ücretsiz & Limitsiz
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full flex flex-col gap-6">
        
        <!-- Yükleme Durumu Uyarı Alanı -->
        <div id="aiStatusBox" class="bg-blue-50 border border-blue-200 text-blue-700 px-4 py-3 rounded-xl flex items-center gap-3 shadow-sm">
            <div class="loader !w-5 !h-5 !border-2 !border-t-blue-600"></div>
            <span class="text-sm font-medium" id="aiStatusText">Yapay Zeka Modülü Yükleniyor... Lütfen bekleyin.</span>
        </div>

        <div id="dropzone" class="border-2 border-dashed border-gray-300 rounded-2xl bg-white p-10 text-center transition-all duration-200 hover:border-blue-400 hover:bg-blue-50 cursor-pointer shadow-sm relative group overflow-hidden">
            <input type="file" id="fileInput" multiple accept="image/jpeg, image/png, image/webp" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" disabled>
            <div class="flex flex-col items-center justify-center gap-3">
                <div class="w-16 h-16 bg-blue-100 text-blue-500 rounded-full flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-images"></i>
                </div>
                <h3 class="text-lg font-semibold text-gray-700">Fotoğraf Seçin (Tıklayın veya Sürükleyin)</h3>
                <p class="text-sm text-gray-500">Max 40 adet (JPG, PNG) - Tüm işlemler cihazınızda gerçekleşir</p>
            </div>
        </div>

        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4 w-full sm:w-auto">
                <div class="text-sm font-medium text-gray-600 shrink-0">
                    Toplam: <span id="imageCount" class="font-bold text-gray-900">0</span> / 40
                </div>
                <div class="h-8 w-px bg-gray-300 hidden sm:block"></div>
                <div class="text-sm text-gray-500 flex-grow truncate" id="statusText">Bekleniyor...</div>
            </div>
            
            <div class="flex gap-2 w-full sm:w-auto shrink-0">
                <button id="clearBtn" class="flex-1 sm:flex-none px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i class="fa-solid fa-trash-can mr-1"></i> Temizle
                </button>
                <button id="startBtn" class="flex-1 sm:flex-none px-5 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm shadow-blue-500/30 flex items-center justify-center gap-2" disabled>
                    <i class="fa-solid fa-play"></i> İşlemi Başlat
                </button>
                <button id="downloadBtn" class="flex-1 sm:flex-none px-5 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700 transition-colors shadow-sm shadow-green-500/30 hidden items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> ZIP İndir
                </button>
            </div>
        </div>

        <div id="progressContainer" class="hidden w-full bg-gray-200 rounded-full h-4 overflow-hidden shadow-inner">
            <div id="progressBar" class="bg-blue-600 h-4 rounded-full transition-all duration-300 w-0 relative">
                <div class="absolute inset-0 bg-white/20" style="background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent); background-size: 1rem 1rem; animation: progress-stripes 1s linear infinite;"></div>
            </div>
        </div>
        <style>@keyframes progress-stripes { from { background-position: 1rem 0; } to { background-position: 0 0; } }</style>

        <div id="gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Gallery items -->
        </div>

    </main>

    <div id="toastContainer" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50 pointer-events-none"></div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const gallery = document.getElementById('gallery');
        const imageCountEl = document.getElementById('imageCount');
        const startBtn = document.getElementById('startBtn');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusText = document.getElementById('statusText');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const toastContainer = document.getElementById('toastContainer');
        const aiStatusBox = document.getElementById('aiStatusBox');
        const aiStatusText = document.getElementById('aiStatusText');

        const MAX_FILES = 40;
        let imagesData = []; 
        let isProcessing = false;
        let isAILoaded = false;
        let activePublicPath = "";

        // CDN Listesi (Sırayla Dener)
        const CDN_LIST = [
            "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.14.0/dist/browser.js",
            "https://unpkg.com/@imgly/background-removal@1.14.0/dist/browser.js"
        ];

        window.showToast = function(message, type = 'error') {
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-500' : (type === 'success' ? 'bg-green-500' : 'bg-blue-500');
            const icon = type === 'error' ? 'fa-circle-xmark' : (type === 'success' ? 'fa-circle-check' : 'fa-circle-info');
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 toast-enter pointer-events-auto max-w-sm`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-sm font-medium break-words">${message}</span>`;
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-leave');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        // Kütüphaneyi güvenli yükleme fonksiyonu
        async function initAI() {
            for (let i = 0; i < CDN_LIST.length; i++) {
                const url = CDN_LIST[i];
                try {
                    await new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = url;
                        script.onload = () => {
                            if (typeof imglyRemoveBackground !== 'undefined') {
                                activePublicPath = url.replace("browser.js", "");
                                resolve();
                            } else {
                                reject(new Error("Global variable not found"));
                            }
                        };
                        script.onerror = () => reject(new Error("Script load failed"));
                        document.head.appendChild(script);
                    });
                    
                    // Başarılı yükleme
                    isAILoaded = true;
                    fileInput.disabled = false;
                    aiStatusBox.classList.replace('bg-blue-50', 'bg-green-50');
                    aiStatusBox.classList.replace('border-blue-200', 'border-green-200');
                    aiStatusBox.classList.replace('text-blue-700', 'text-green-700');
                    aiStatusBox.innerHTML = `<i class="fa-solid fa-circle-check text-green-600"></i> <span class="text-sm font-medium">Yapay Zeka Hazır! Fotoğrafları yükleyebilirsiniz.</span>`;
                    return; // Döngüden çık
                } catch (err) {
                    console.warn(`CDN Hatalı: ${url}`);
                }
            }

            // Eğer hepsi başarısız olursa
            aiStatusBox.classList.replace('bg-blue-50', 'bg-red-50');
            aiStatusBox.classList.replace('border-blue-200', 'border-red-200');
            aiStatusBox.classList.replace('text-blue-700', 'text-red-700');
            aiStatusBox.innerHTML = `
                <i class="fa-solid fa-triangle-exclamation text-red-600"></i> 
                <span class="text-sm font-medium">Android 'content://' güvenlik duvarı motor indirmesini engelledi. Lütfen bu dosyayı bilgisayarda açın veya ücretsiz bir siteye yükleyin.</span>
            `;
            window.showToast("Güvenlik duvarı aşılamadı.", "error");
        }

        // Sayfa açıldığında AI'ı yüklemeye başla
        window.addEventListener('DOMContentLoaded', () => {
            initAI();
        });

        function updateUI() {
            imageCountEl.textContent = imagesData.length;
            if (imagesData.length > 0 && !isProcessing && isAILoaded) {
                startBtn.disabled = false;
                clearBtn.disabled = false;
            } else {
                startBtn.disabled = true;
                clearBtn.disabled = isProcessing;
            }
            if (imagesData.length === 0) {
                downloadBtn.classList.add('hidden');
                progressContainer.classList.add('hidden');
                statusText.textContent = "Bekleniyor...";
            }
        }

        function handleFiles(files) {
            if (!isAILoaded) {
                window.showToast("Lütfen Yapay Zeka modülünün yüklenmesini bekleyin.", "error");
                return;
            }
            if (isProcessing) return;
            const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
            const availableSlots = MAX_FILES - imagesData.length;
            const filesToAdd = validFiles.slice(0, availableSlots);

            if (validFiles.length > availableSlots && availableSlots === 0) {
                window.showToast(`En fazla ${MAX_FILES} fotoğraf yükleyebilirsiniz.`, "error");
            }

            filesToAdd.forEach(file => {
                const id = Math.random().toString(36).substr(2, 9);
                imagesData.push({
                    id, file, originalUrl: URL.createObjectURL(file), processedBlob: null, processedUrl: null, status: 'pending'
                });
            });
            renderGallery();
            updateUI();
        }

        window.removeImage = function(id) {
            if (isProcessing) return;
            imagesData = imagesData.filter(img => img.id !== id);
            renderGallery();
            updateUI();
        }

        function renderGallery() {
            gallery.innerHTML = '';
            imagesData.forEach(img => {
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm relative group aspect-[3/4] flex flex-col";
                
                const displayUrl = img.processedUrl || img.originalUrl;
                
                let statusBadge = '';
                if (img.status === 'processing') statusBadge = `<div class="absolute top-2 left-2 bg-blue-500 text-white text-xs px-2 py-1 rounded-md flex items-center gap-1 shadow"><div class="loader !w-3 !h-3 !border-2"></div> İşleniyor</div>`;
                else if (img.status === 'done') statusBadge = `<div class="absolute top-2 left-2 bg-green-500 text-white text-xs px-2 py-1 rounded-md flex items-center gap-1 shadow"><i class="fa-solid fa-check"></i> Tamamlandı</div>`;
                else if (img.status === 'error') statusBadge = `<div class="absolute top-2 left-2 bg-red-500 text-white text-xs px-2 py-1 rounded-md flex items-center gap-1 shadow"><i class="fa-solid fa-xmark"></i> Hata</div>`;

                let deleteBtn = (!isProcessing && img.status !== 'done') ? `<button onclick="removeImage('${img.id}')" class="absolute top-2 right-2 w-8 h-8 bg-red-500 hover:bg-red-600 text-white rounded-full flex items-center justify-center shadow-md z-10"><i class="fa-solid fa-trash"></i></button>` : '';
                const imgBgClass = img.status === 'done' ? 'bg-white' : 'bg-gray-100';

                card.innerHTML = `
                    <div class="w-full h-full ${imgBgClass} relative">
                        <img src="${displayUrl}" class="w-full h-full object-contain" alt="Preview">
                        ${statusBadge}
                        ${deleteBtn}
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dropzone-active'); });
        dropzone.addEventListener('dragleave', (e) => { e.preventDefault(); dropzone.classList.remove('dropzone-active'); });
        dropzone.addEventListener('drop', (e) => { e.preventDefault(); dropzone.classList.remove('dropzone-active'); handleFiles(e.dataTransfer.files); });
        fileInput.addEventListener('change', (e) => { handleFiles(e.target.files); fileInput.value = ''; });
        clearBtn.addEventListener('click', () => { imagesData = []; renderGallery(); updateUI(); });

        async function optimizeImage(file, maxSize = 1024) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    if (width > maxSize || height > maxSize) {
                        if (width > height) { height = Math.round(height * (maxSize / width)); width = maxSize; } 
                        else { width = Math.round(width * (maxSize / height)); height = maxSize; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => resolve(new File([blob], file.name, {type: file.type})), file.type, 0.95);
                };
                img.onerror = () => resolve(file);
                img.src = URL.createObjectURL(file);
            });
        }

        async function transparentToWhiteBg(transparentBlob) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    canvas.toBlob(resolve, 'image/jpeg', 0.95);
                };
                img.onerror = () => reject(new Error("Zemin hatası"));
                img.src = URL.createObjectURL(transparentBlob);
            });
        }

        startBtn.addEventListener('click', async () => {
            if (imagesData.length === 0 || !isAILoaded) return;
            isProcessing = true;
            updateUI();
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            
            let successCount = 0;
            let errorCount = 0;

            const config = {
                publicPath: activePublicPath,
                model: "small", // Mobil için en güvenli sürüm
                proxyToWorker: false // Android engelini aşmak için mecburi
            };

            for (let i = 0; i < imagesData.length; i++) {
                const item = imagesData[i];
                if (item.status === 'done') continue;

                item.status = 'processing';
                renderGallery();
                
                try {
                    statusText.innerHTML = `<strong>${i + 1} / ${imagesData.length}</strong> - AI İşliyor (İlk resim uzun sürer)...`;
                    
                    // Arayüz donmasın diye küçük bir nefes payı
                    await new Promise(r => setTimeout(r, 100)); 

                    const optimizedFile = await optimizeImage(item.file);
                    const transparentBlob = await imglyRemoveBackground(optimizedFile, config);
                    
                    statusText.innerHTML = `<strong>${i + 1} / ${imagesData.length}</strong> - Zemin ayarlanıyor...`;
                    const whiteBgBlob = await transparentToWhiteBg(transparentBlob);
                    
                    item.processedBlob = whiteBgBlob;
                    item.processedUrl = URL.createObjectURL(whiteBgBlob);
                    item.status = 'done';
                    successCount++;
                } catch (error) {
                    console.error(error);
                    item.status = 'error';
                    errorCount++;
                    window.showToast(`Resim ${i + 1} Hatası`, "error");
                }

                progressBar.style.width = `${((i + 1) / imagesData.length) * 100}%`;
                renderGallery();
            }

            isProcessing = false;
            
            if (successCount > 0) {
                statusText.innerHTML = `<span class="text-green-600 font-bold"><i class="fa-solid fa-check"></i> ${successCount} fotoğraf tamamlandı.</span>`;
                downloadBtn.classList.remove('hidden'); 
                downloadBtn.classList.add('flex'); 
                
                if (errorCount === 0) window.showToast(`Tüm işlemler başarıyla tamamlandı!`, "success");
            } else {
                statusText.innerHTML = `<span class="text-red-600 font-bold">İşlem başarısız. Bellek yetmemiş olabilir.</span>`;
            }
            updateUI();
        });

        downloadBtn.addEventListener('click', async () => {
            const zip = new JSZip();
            const folder = zip.folder("Beyaz_Arkaplanli_Fotograflar");
            
            const originalText = downloadBtn.innerHTML;
            downloadBtn.innerHTML = `<div class="loader !w-4 !h-4 !border-2 !border-t-white"></div> İndiriliyor...`;
            downloadBtn.disabled = true;

            imagesData.forEach((item, index) => {
                if (item.status === 'done' && item.processedBlob) {
                    let name = item.file.name.substring(0, item.file.name.lastIndexOf('.')) || `resim_${index + 1}`;
                    folder.file(`${name}_beyaz.jpg`, item.processedBlob);
                }
            });

            try {
                const content = await zip.generateAsync({type:"blob"});
                saveAs(content, "temizlenmis_fotograflar.zip");
            } catch (e) {
                window.showToast("ZIP Hatası.", "error");
            }
            
            downloadBtn.innerHTML = originalText;
            downloadBtn.disabled = false;
        });
    </script>
</body>
</html>
